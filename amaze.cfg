# These are defaults for the first run only: after that, Amaze remembers the
# window size, full screen and last level played. Command-line options
# (-f, -w, -l, --file; see amaze -h) override both.

WindowWidth = 1920
WindowHeight = 1200

# Start in full screen (F toggles full screen while playing)
FullScreen = true

GameLevel = 99
